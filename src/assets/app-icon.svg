<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- App-Icon für den Home-Bildschirm: Logo auf vollflächigem Petrol (iOS rundet die Ecken selbst ab).
       Quelle für public/apple-touch-icon.png und public/icon-*.png -->
  <rect width="200" height="200" fill="#1F4E5A"/>
  <g transform="translate(100 104) scale(0.86) translate(-100 -104)">
  
  

  <!-- Kartenfächer -->
  <g stroke="#1F4E5A" stroke-width="3">
    <g transform="rotate(-25 100 170)">
      <rect x="72" y="36" width="56" height="76" rx="8" fill="#FFF6E5"/>
      <text x="84" y="60" font-family="Georgia, serif" font-size="20" fill="#2E7D6B" stroke="none">♣</text>
    </g>
    <g transform="rotate(-8 100 170)">
      <rect x="72" y="30" width="56" height="76" rx="8" fill="#FFF6E5"/>
      <text x="84" y="54" font-family="Georgia, serif" font-size="20" fill="#5B4B8A" stroke="none">♠</text>
    </g>
    <g transform="rotate(8 100 170)">
      <rect x="72" y="30" width="56" height="76" rx="8" fill="#FFF6E5"/>
      <text x="84" y="54" font-family="Georgia, serif" font-size="20" fill="#E8772E" stroke="none">♥</text>
    </g>
    <g transform="rotate(25 100 170)">
      <rect x="72" y="36" width="56" height="76" rx="8" fill="#FFF6E5"/>
      <text x="84" y="60" font-family="Georgia, serif" font-size="20" fill="#F2B134" stroke="none">♦</text>
    </g>
  </g>

  <!-- Fuchskopf -->
  <g stroke="#1F4E5A" stroke-width="3" stroke-linejoin="round">
    <!-- Ohren -->
    <path d="M52 66 L44 120 L86 104 Z" fill="#E8772E"/>
    <path d="M148 66 L156 120 L114 104 Z" fill="#E8772E"/>
    <path d="M56 80 L52 113 L76 104 Z" fill="#1F4E5A" stroke="none"/>
    <path d="M144 80 L148 113 L124 104 Z" fill="#1F4E5A" stroke="none"/>
    <!-- Gesicht -->
    <path d="M40 112 C58 92 142 92 160 112 L114 176 Q100 188 86 176 Z" fill="#E8772E"/>
    <!-- helle Wangen -->
    <path d="M40 112 C56 134 76 146 100 146 C124 146 144 134 160 112 L114 176 Q100 188 86 176 Z" fill="#FFF6E5"/>
  </g>
  <!-- Augen und Nase -->
  <ellipse cx="78" cy="126" rx="6" ry="8" fill="#1F4E5A"/>
  <ellipse cx="122" cy="126" rx="6" ry="8" fill="#1F4E5A"/>
  <circle cx="80" cy="123" r="2" fill="#FFF6E5"/>
  <circle cx="124" cy="123" r="2" fill="#FFF6E5"/>
  <ellipse cx="100" cy="174" rx="9" ry="6" fill="#1F4E5A"/>
  </g>
</svg>
